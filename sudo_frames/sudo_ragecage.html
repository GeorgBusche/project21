<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark"> <!-- WICHTIG GEGEN WEISSE BLITZER -->
  <style>
    /* 1. Echte Transparenz, damit das Terminal im Hintergrund sichtbar bleibt */
    body, html { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; 
      background-color: transparent !important; /* <--- HIER ÄNDERN */
      overflow: hidden; 
    }
    
    /* CRT Scanlines für den nahtlosen Übergang */
    body::before {
      content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.8;
    }
    
    /* ... restliches CSS ... */
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: transparent !important; overflow: hidden; }
    .rage-speedlines { position: fixed; inset: -50vw; z-index: 35; pointer-events: none; opacity: 0; background: repeating-conic-gradient(from 0deg, transparent 0deg 10deg, rgba(255, 255, 255, 0.15) 10deg 20deg); animation: speedlinesSpin 3s linear infinite; transition: opacity 0.2s; }
    .rage-speedlines.hyper { animation: speedlinesSpin 0.5s linear infinite; opacity: 1; background: repeating-conic-gradient(from 0deg, transparent 0deg 10deg, rgba(255, 0, 0, 0.4) 10deg 20deg); }
    @keyframes speedlinesSpin { 0% { transform: rotate(0deg) scale(2); } 100% { transform: rotate(360deg) scale(2); } }
    .rage-text { position: fixed; top: 50%; left: 50%; transform: translate3d(-50%, -50%, 0) skewX(-15deg); width: calc(100vw - 2rem); max-height: calc(100vh - 2rem); box-sizing: border-box; text-align: center; text-wrap: balance; overflow-wrap: anywhere; font-size: clamp(1.5rem, min(20vw, 18vh), 14rem); font-weight: 900; color: #fbbf24; text-shadow: 6px 6px 0px #dc2626, -3px -3px 0px #000, 0 0 50px #ef4444; z-index: 9999; pointer-events: none; font-family: 'Impact', sans-serif; text-transform: uppercase; line-height: 0.9; contain: layout paint style; will-change: transform, opacity; }
    @keyframes smashGasLeft { 0% { transform: translate3d(-100%, -50%, 0) skewX(-30deg) scale(2); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0) skewX(-15deg) scale(1); opacity: 1; } }
    @keyframes smashGasRight { 0% { transform: translate3d(100%, -50%, 0) skewX(30deg) scale(2); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0) skewX(-15deg) scale(1); opacity: 1; } }
    @keyframes stompGasCenter { 0% { transform: translate3d(-50%, -50%, 0) skewX(-15deg) scale(4); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0) skewX(-15deg) scale(1); opacity: 1; } }
    @keyframes textFlicker { 0%, 100% { opacity: 1; transform: translate3d(-50%, -50%, 0) skewX(-15deg) scale(1); } 50% { opacity: 0.8; transform: translate3d(-52%, -48%, 0) skewX(-20deg) scale(1.1); } }
    .ping-pong { position: fixed; width: 30px; height: 30px; background: radial-gradient(circle at 10px 10px, #ffffff, #d1d5db); border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 9996; pointer-events: none; will-change: transform; }
    @keyframes bounceBall { 0% { transform: translate3d(0, -20vh, 0) scale(1); } 50% { transform: translate3d(0, 100vh, 0) scale(0.9); } 100% { transform: translate3d(0, 20vh, 0) scale(1); } }
    .red-cup { position: fixed; z-index: 9995; font-size: clamp(4rem, 10vw, 8rem); pointer-events: none; will-change: transform; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
    @keyframes flyCup { 0% { transform: translate3d(-20vw, 120vh, 0) rotate(-45deg); } 100% { transform: translate3d(120vw, -20vh, 0) rotate(180deg); } }
    .rage-strobe { position: fixed; inset: 0; z-index: 9998; pointer-events: none; animation: strobeFlash 0.15s infinite; opacity: 0; transform: translateZ(0); }
    @keyframes strobeFlash { 0%, 100% { background: transparent; opacity: 0; } 50% { background: #ef4444; opacity: 0.6; } }
    .rage-borders { position: fixed; inset: 0; z-index: 9997; pointer-events: none; border-top: 30px solid #dc2626; border-bottom: 30px solid #dc2626; opacity: 0; transition: opacity 0.2s; background: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(0,0,0,0.5) 40px, rgba(0,0,0,0.5) 80px); }
  </style>
</head>
<body>
  <audio id="audioGas" preload="auto" src="../assets/audio/gas.mp3"></audio>
  <script src="cue-timings.js"></script>

  <script>
    const root = window.parent.document.getElementById('bodyRoot');
    const appendLine = window.parent.appendLine;
    const playTone = window.parent.playTone;

    const RAGE_CONFIG = Object.assign(
      { c6_drop: 2700, duration: 8300, fadeTime: 2000 },
      window.SUDO_CUE_TIMINGS?.ragecage || {}
    );

    function resetRageAnimation(element, animationName) { element.style.animation = 'none'; element.offsetHeight; element.style.animation = animationName; }

    function spawnPingPongBalls() {
      for (let i = 0; i < 5; i++) {
        const ball = document.createElement('div'); ball.className = 'ping-pong';
        const startX = Math.random() * 100; ball.style.left = `${startX}vw`;
        const durY = 0.4 + Math.random() * 0.3; ball.style.animation = `bounceBall ${durY}s infinite alternate ease-in`;
        const drift = (Math.random() - 0.5) * 60; ball.style.transform = `translateX(${drift}vw)`; ball.style.transition = `transform ${durY * 4}s linear`;
        document.body.appendChild(ball);
        setTimeout(() => { if (ball.parentNode) ball.style.transform = `translateX(${drift * 3}vw)`; }, 50);
        setTimeout(() => { if (ball.parentNode) ball.remove(); }, 3000);
      }
    }

    function spawnRedCups() {
      for (let i = 0; i < 3; i++) {
        const cup = document.createElement('div'); cup.className = 'red-cup'; cup.textContent = '🥤';
        cup.style.top = `${Math.random() * 100}vh`; const dur = 0.5 + Math.random() * 0.5; cup.style.animation = `flyCup ${dur}s linear forwards`;
        document.body.appendChild(cup); setTimeout(() => { if (cup.parentNode) cup.remove(); }, dur * 1000);
      }
    }

    window.onload = () => {
      const audioElem = document.getElementById('audioGas');
      window.startSudoTimeline(audioElem, () => {

      appendLine(`<span class='text-red-500 font-extrabold'>[RAGECAGE] SYSTEM STAPELT BECHER! BEREITMACHEN!</span>`);

      const speedBg = document.createElement('div'); speedBg.className = 'rage-speedlines'; document.body.appendChild(speedBg);
      const borders = document.createElement('div'); borders.className = 'rage-borders'; document.body.appendChild(borders);
      const mainText = document.createElement('div'); mainText.className = 'rage-text'; document.body.appendChild(mainText);

      setTimeout(() => { speedBg.style.opacity = "0.3"; mainText.innerHTML = "GAS"; resetRageAnimation(mainText, 'smashGasLeft 0.1s ease-out forwards'); if (navigator.vibrate) navigator.vibrate(100); }, RAGE_CONFIG.c1_gas1);
      setTimeout(() => { speedBg.style.opacity = "0.5"; mainText.innerHTML = "GAS"; resetRageAnimation(mainText, 'smashGasRight 0.1s ease-out forwards'); if (navigator.vibrate) navigator.vibrate(100); }, RAGE_CONFIG.c2_gas2);
      setTimeout(() => { speedBg.style.opacity = "0.7"; mainText.style.color = "#ef4444"; mainText.innerHTML = "GAS"; resetRageAnimation(mainText, 'smashGasLeft 0.1s ease-out forwards'); if (navigator.vibrate) navigator.vibrate(100); }, RAGE_CONFIG.c3_gas3);
      setTimeout(() => { speedBg.style.opacity = "0.9"; mainText.innerHTML = "GAS"; resetRageAnimation(mainText, 'smashGasRight 0.1s ease-out forwards'); if (navigator.vibrate) navigator.vibrate(100); }, RAGE_CONFIG.c4_gas4);
      setTimeout(() => { speedBg.classList.add('hyper'); borders.style.opacity = "1"; mainText.style.color = "#ffffff"; mainText.innerHTML = "GAS!!!"; resetRageAnimation(mainText, 'stompGasCenter 0.1s ease-out forwards'); if (navigator.vibrate) navigator.vibrate([200, 50, 200]); }, RAGE_CONFIG.c5_gas5);

      setTimeout(() => {
        root.classList.add('cam-speed-shake');
        const strobe = document.createElement('div'); strobe.className = 'rage-strobe'; document.body.appendChild(strobe);
        setInterval(spawnPingPongBalls, 200); setInterval(spawnRedCups, 400);

        if (navigator.vibrate) navigator.vibrate([600, 100, 600, 100, 600, 100, 1000]);
        appendLine(`<span class='text-yellow-400 font-extrabold text-sm animate-pulse'>🏎️ [EUROBEAT] RAGECAGE LÄUFT! WEITER WEITER WEITER!</span>`);

        const panicWords = ["WEITER!", "TRINK!", "RECHTS!", "LINKS!", "STAPELN!", "BALL WEITER!", "HOPP HOPP!"];
        setInterval(() => {
          mainText.style.color = Math.random() > 0.5 ? "#ffffff" : "#fbbf24";
          mainText.innerHTML = panicWords[Math.floor(Math.random() * panicWords.length)];
          resetRageAnimation(mainText, 'textFlicker 0.2s forwards');
        }, 450); 

        setTimeout(() => {
          if (audioElem && !audioElem.paused) {
            const fadeInterval = setInterval(() => {
              if (audioElem.volume > 0.05) audioElem.volume -= 0.05; else { audioElem.pause(); clearInterval(fadeInterval); }
            }, RAGE_CONFIG.fadeTime / 20);
          }
        }, (RAGE_CONFIG.duration - RAGE_CONFIG.c6_drop) - RAGE_CONFIG.fadeTime);

        setTimeout(() => { window.parent.postMessage("sudo_finished", "*"); }, RAGE_CONFIG.duration - RAGE_CONFIG.c6_drop);
      }, RAGE_CONFIG.c6_drop);
      }, 'Ragecage');
    };
  </script>
</body>
</html>
