<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark"> <!-- WICHTIG GEGEN WEISSE BLITZER -->
  <style>
    /* 1. Echte Transparenz, damit das Terminal im Hintergrund sichtbar bleibt */
    body, html { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; 
      background-color: transparent !important; /* <--- HIER ÄNDERN */
      overflow: hidden; 
    }
    
    /* CRT Scanlines für den nahtlosen Übergang */
    body::before {
      content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.8;
    }
    
    /* ... restliches CSS ... */
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: transparent !important; overflow: hidden; }
    .wolle-flannel { position: fixed; inset: -20vw; z-index: 35; pointer-events: none; opacity: 0; transition: filter 0.1s, transform 0.3s; background-color: #b91c1c; background-image: repeating-linear-gradient(transparent, transparent 50px, rgba(0,0,0,.6) 50px, rgba(0,0,0,.6) 53px, transparent 53px, transparent 63px, rgba(0,0,0,.6) 63px, rgba(0,0,0,.6) 66px, transparent 66px, transparent 116px, rgba(0,0,0,.7) 116px, rgba(0,0,0,.7) 166px, rgba(255,255,255,.2) 166px, rgba(255,255,255,.2) 169px, rgba(0,0,0,.7) 169px, rgba(0,0,0,.7) 179px, rgba(255,255,255,.2) 179px, rgba(255,255,255,.2) 182px, rgba(0,0,0,.7) 182px, rgba(0,0,0,.7) 232px, transparent 232px), repeating-linear-gradient(270deg, transparent, transparent 50px, rgba(0,0,0,.6) 50px, rgba(0,0,0,.6) 53px, transparent 53px, transparent 63px, rgba(0,0,0,.6) 63px, rgba(0,0,0,.6) 66px, transparent 66px, transparent 116px, rgba(0,0,0,.7) 116px, rgba(0,0,0,.7) 166px, rgba(255,255,255,.2) 166px, rgba(255,255,255,.2) 169px, rgba(0,0,0,.7) 169px, rgba(0,0,0,.7) 179px, rgba(255,255,255,.2) 179px, rgba(255,255,255,.2) 182px, rgba(0,0,0,.7) 182px, rgba(0,0,0,.7) 232px, transparent 232px); }
    .wolle-silver { filter: grayscale(1) brightness(1.5); } .wolle-gold { filter: sepia(1) hue-rotate(5deg) saturate(3) brightness(1.2); } .wolle-blue { filter: hue-rotate(210deg) saturate(2); } .wolle-rainbow { animation: rainbowFlannel 0.3s infinite linear; }
    @keyframes rainbowFlannel { 0% { filter: hue-rotate(0deg) saturate(3); } 100% { filter: hue-rotate(360deg) saturate(3); } }
    .wolle-spotlight { position: fixed; bottom: -20vh; width: 20vw; height: 150vh; background: linear-gradient(to top, rgba(255,255,255,0.8), transparent); border-radius: 50%; filter: blur(20px); z-index: 9991; pointer-events: none; transform-origin: bottom center; mix-blend-mode: overlay; }
    .spot-left { left: 10vw; animation: sweepRight 2s infinite alternate ease-in-out; } .spot-right { right: 10vw; animation: sweepLeft 2.3s infinite alternate ease-in-out; }
    @keyframes sweepRight { 0% { transform: rotate(-40deg); } 100% { transform: rotate(40deg); } } @keyframes sweepLeft { 0% { transform: rotate(40deg); } 100% { transform: rotate(-40deg); } }
    .wolle-karaoke { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); width: calc(100vw - 2rem); max-height: calc(100vh - 2rem); box-sizing: border-box; text-align: center; text-wrap: balance; overflow-wrap: anywhere; font-size: clamp(1.5rem, min(11vw, 12vh), 7rem); font-weight: 900; color: #ffd700; text-shadow: 6px 6px 0px #000, -3px -3px 0px #000, 0 0 40px rgba(255,215,0,0.9); z-index: 9999; pointer-events: none; font-family: 'Impact', sans-serif; text-transform: uppercase; line-height: 1.1; }
    @keyframes smashIn { 0% { transform: translate(-50%, -50%) scale(3); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    @keyframes barrelRoll { 0% { transform: translate(-50%, -50%) rotate(180deg) scale(0); opacity: 0; } 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; } }
    @keyframes heartbeatText { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } }
    @keyframes shakeAggro { 0%, 100% { transform: translate(-50%, -50%) rotate(0); } 25% { transform: translate(-52%, -48%) rotate(-5deg); } 75% { transform: translate(-48%, -52%) rotate(5deg); } }
    .wolle-lighter { position: fixed; bottom: -5vh; font-size: clamp(4rem, 10vw, 7rem); z-index: 9990; pointer-events: none; filter: drop-shadow(0 -15px 35px #f59e0b); animation: lighterSway 2s ease-in-out infinite alternate; transform-origin: bottom center; }
    @keyframes lighterSway { 0% { transform: rotate(-30deg) translateY(10px); } 100% { transform: rotate(30deg) translateY(-10px); } }
    @keyframes fallDownFast { 0% { top: -20%; transform: rotate(0deg) scale(0.5); } 100% { top: 120%; transform: rotate(720deg) scale(1.5); } }
    .wolle-falling-item { position: fixed; z-index: 9996; pointer-events: none; font-size: clamp(4rem, 8vw, 7rem); animation: fallDownFast linear forwards; }
    .wolle-flash { position: fixed; inset: 0; background: white; z-index: 99999; pointer-events: none; animation: flashBang 0.4s ease-out forwards; }
    @keyframes flashBang { 0% { opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <audio id="audioWolle" preload="auto" src="../assets/audio/wolle.mp3"></audio>
  <script src="cue-timings.js"></script>

  <script>
    const root = window.parent.document.getElementById('bodyRoot');
    const appendLine = window.parent.appendLine;
    const playTone = window.parent.playTone;

    const WOLLE_CONFIG = Object.assign(
      { duration: 16000, fadeTime: 2500 },
      window.SUDO_CUE_TIMINGS?.wolle || {}
    );

    function resetAnimation(element, animationName) { element.style.animation = 'none'; element.offsetHeight; element.style.animation = animationName; }

    function spawnWolleRain(emojis, count, durationBase) {
      for (let i = 0; i < count; i++) {
        const item = document.createElement('div'); item.className = 'wolle-falling-item'; item.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        item.style.left = `${(Math.random() * 120) - 10}vw`; const dur = durationBase + (Math.random() * 1.5);
        item.style.animationDuration = `${dur}s`; item.style.animationDelay = `${Math.random() * 0.4}s`;
        document.body.appendChild(item); setTimeout(() => { if (item.parentNode) item.remove(); }, (dur + 0.5) * 1000);
      }
    }

    function triggerCameraFlash() {
      const flash = document.createElement('div'); flash.className = 'wolle-flash';
      document.body.appendChild(flash); setTimeout(() => flash.remove(), 450);
    }

    window.onload = () => {
      const audioElem = document.getElementById('audioWolle');
      window.startSudoTimeline(audioElem, () => {

      appendLine(`<span class='text-pink-400 font-bold'>[SUDO] DIRECTOR'S CUT: VOKUHILA-OVERDRIVE INITIIERT!</span>`);

      const flannelBg = document.createElement('div'); flannelBg.className = 'wolle-flannel'; document.body.appendChild(flannelBg);
      const karaokeText = document.createElement('div'); karaokeText.className = 'wolle-karaoke'; document.body.appendChild(karaokeText);

      setTimeout(() => { flannelBg.style.opacity = "1"; karaokeText.style.color = "#cd7f32"; karaokeText.innerHTML = "BRONZE"; resetAnimation(karaokeText, 'smashIn 0.2s ease-out forwards'); triggerCameraFlash(); }, WOLLE_CONFIG.cut1_bronze);
      setTimeout(() => { flannelBg.className = 'wolle-flannel wolle-silver'; karaokeText.style.color = "#c0c0c0"; karaokeText.innerHTML = "SILBER"; resetAnimation(karaokeText, 'smashIn 0.2s ease-out forwards'); }, WOLLE_CONFIG.cut2_silber);
      setTimeout(() => { flannelBg.className = 'wolle-flannel wolle-gold'; karaokeText.style.color = "#ffd700"; karaokeText.innerHTML = "& GOLD!"; resetAnimation(karaokeText, 'smashIn 0.2s ease-out forwards'); spawnWolleRain(['🥇', '🏆', '⭐'], 15, 1.2); }, WOLLE_CONFIG.cut3_gold);
      setTimeout(() => { flannelBg.className = 'wolle-flannel'; karaokeText.style.color = "#ef4444"; karaokeText.innerHTML = "❌ NIE<br>GEWOLLT!"; resetAnimation(karaokeText, 'shakeAggro 0.4s infinite'); root.classList.add('wolle-3d-tilt'); triggerCameraFlash(); }, WOLLE_CONFIG.cut4_niegewollt);

      setTimeout(() => {
        root.classList.remove('wolle-3d-tilt'); flannelBg.className = 'wolle-flannel wolle-blue'; karaokeText.style.color = "#3b82f6"; karaokeText.innerHTML = "👀 ICH WILL<br>NUR DICH..."; resetAnimation(karaokeText, 'popIn 0.4s forwards');
        ['spot-left', 'spot-right'].forEach(cls => { const spot = document.createElement('div'); spot.className = `wolle-spotlight ${cls}`; document.body.appendChild(spot); });
        const lighterCount = Math.floor(window.innerWidth / 80); 
        for (let i = 0; i < lighterCount; i++) {
          const lighter = document.createElement('div'); lighter.className = 'wolle-lighter'; lighter.textContent = '🔥'; lighter.style.left = `${(i * 80) + (Math.random() * 20)}px`; lighter.style.animationDelay = `-${Math.random() * 3}s`;
          document.body.appendChild(lighter);
        }
      }, WOLLE_CONFIG.cut5_ichwill);

      setTimeout(() => { karaokeText.style.color = "#ec4899"; karaokeText.innerHTML = "❤️ NUR DICH<br>ALLEIN! ❤️"; resetAnimation(karaokeText, 'heartbeatText 0.8s infinite'); root.classList.add('wolle-schunkel'); spawnWolleRain(['💖', '🫶', '💋'], 25, 1.5); }, WOLLE_CONFIG.cut6_allein);
      setTimeout(() => { flannelBg.className = 'wolle-flannel wolle-gold'; karaokeText.style.color = "#ffd700"; karaokeText.innerHTML = "BRONZE, SILBER<br>& GOLD..."; resetAnimation(karaokeText, 'barrelRoll 0.6s forwards'); triggerCameraFlash(); }, WOLLE_CONFIG.cut7_bronze2);
      setTimeout(() => { flannelBg.className = 'wolle-flannel'; karaokeText.style.color = "#ef4444"; karaokeText.innerHTML = "❌ NIE GEWOLLT!"; resetAnimation(karaokeText, 'shakeAggro 0.4s infinite'); karaokeText.style.transform = "translate(-50%, -50%) scale(1.4)"; }, WOLLE_CONFIG.cut8_niegewollt2);
      setTimeout(() => { flannelBg.className = 'wolle-flannel wolle-blue'; karaokeText.style.color = "#06b6d4"; karaokeText.innerHTML = "☝️ ICH WILL<br>NUR EINS..."; resetAnimation(karaokeText, 'smashIn 0.3s forwards'); }, WOLLE_CONFIG.cut9_nureins);

      setTimeout(() => {
        triggerCameraFlash(); flannelBg.className = 'wolle-flannel wolle-rainbow'; 
        karaokeText.style.color = "#ffffff"; karaokeText.style.textShadow = "0 0 50px #ec4899, 0 0 100px #3b82f6"; karaokeText.innerHTML = "🍻 NUR DICH<br>ALLEIN! 🍻"; resetAnimation(karaokeText, 'heartbeatText 0.4s infinite');
        root.classList.remove('wolle-schunkel'); root.classList.add('wolle-hyper-schunkel');
        spawnWolleRain(['🍻', '🍺', '🎸', '🪩', '🎉', '🎤'], 60, 1.2);
        appendLine("<span class='text-pink-400 font-extrabold text-sm animate-pulse'>🍻 [HYPER-STADION] REGENBOGEN-FLANELL AKTIVIERT! HÖLLE HÖLLE HÖLLE!</span>");
        if (navigator.vibrate) navigator.vibrate([400, 100, 400, 100, 600, 100, 800]);

        setTimeout(() => {
          if (audioElem && !audioElem.paused) {
            const fadeInterval = setInterval(() => {
              if (audioElem.volume > 0.05) audioElem.volume -= 0.05; else { audioElem.pause(); clearInterval(fadeInterval); }
            }, WOLLE_CONFIG.fadeTime / 20);
          }
        }, (WOLLE_CONFIG.duration - WOLLE_CONFIG.cut10_allein2) - WOLLE_CONFIG.fadeTime);

        setTimeout(() => { window.parent.postMessage("sudo_finished", "*"); }, WOLLE_CONFIG.duration - WOLLE_CONFIG.cut10_allein2);
      }, WOLLE_CONFIG.cut10_allein2);
      }, 'Wolle');
    };
  </script>
</body>
</html>
