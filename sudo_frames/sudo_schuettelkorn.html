<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark"> <!-- WICHTIG GEGEN WEISSE BLITZER -->
 <style>
    /* 1. Echte Transparenz, damit das Terminal im Hintergrund sichtbar bleibt */
    body, html { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; 
      background-color: transparent !important; /* <--- HIER ÄNDERN */
      overflow: hidden; 
    }
    
    /* CRT Scanlines für den nahtlosen Übergang */
    body::before {
      content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.8;
    }
    
    /* ... restliches CSS ... */
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: transparent !important; overflow: hidden; }
    @keyframes sadRain { 0% { transform: translate3d(0, -20vh, 0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate3d(0, 120vh, 0); opacity: 0; } }
    .korn-tear { position: fixed; z-index: 9990; font-size: 2rem; pointer-events: none; animation: sadRain 1s linear infinite; opacity: 0.5; will-change: transform; }
    @keyframes brauseFizz { 0% { transform: translate3d(0, 110vh, 0) scale(0.5) rotate(0deg); opacity: 1; } 100% { transform: translate3d(0, -10vh, 0) scale(1.5) rotate(360deg); opacity: 0; } }
    .brause-bubble { position: fixed; z-index: 9996; pointer-events: none; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.4)); border-radius: 50%; border: 1px solid rgba(255,255,255,0.8); animation: brauseFizz linear forwards; will-change: transform; }
    .korn-text { position: fixed; top: 50%; left: 50%; transform: translate3d(-50%, -50%, 0); width: 100vw; text-align: center; font-size: clamp(4rem, 15vw, 12rem); font-weight: 900; color: #ffffff; text-shadow: 4px 4px 0px #1e3a8a, 0 0 30px #3b82f6; z-index: 9999; pointer-events: none; font-family: 'Impact', sans-serif; text-transform: uppercase; line-height: 0.9; contain: layout paint style; will-change: transform, color, text-shadow; }
    .text-brause { color: #f472b6; text-shadow: 6px 6px 0px #be185d, 0 0 50px #db2777; } .text-korn { color: #fcd34d; text-shadow: 6px 6px 0px #b45309, 0 0 40px #d97706; }
    .fizz-shake { animation: fizzing 0.05s infinite; }
    @keyframes fizzing { 0% { transform: translate3d(-51%, -51%, 0) rotate(-1deg); } 100% { transform: translate3d(-49%, -49%, 0) rotate(1deg); } }
    @keyframes dropInSad { 0% { transform: translate3d(-50%, -150%, 0); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0); opacity: 1; } }
    @keyframes smashKorn { 0% { transform: translate3d(-50%, -50%, 0) scale(4) rotate(15deg); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0) scale(1) rotate(0); opacity: 1; } }
    @keyframes spinVorn { 0% { transform: translate3d(-50%, -50%, 0) rotate(180deg) scale(0); } 100% { transform: translate3d(-50%, -50%, 0) rotate(0deg) scale(1.5); } }
    @keyframes dropItem { 0% { transform: translate3d(0, -120vh, 0) rotate(25deg); } 100% { transform: translate3d(0, 120vh, 0) rotate(-25deg); } }
    .schuettel-item { position: fixed; z-index: 9995; font-size: clamp(4rem, 10vw, 8rem); pointer-events: none; animation: dropItem 1s linear forwards; will-change: transform; }
  </style>
</head>
<body>
  <div id="discoOverlay" class="fixed inset-0 pointer-events-none z-40 opacity-0 transition-opacity duration-75"></div>
  <audio id="audioKorn" preload="auto" src="../assets/audio/schuettelkorn.mp3"></audio>

  <script>
    const root = window.parent.document.getElementById('bodyRoot');
    const appendLine = window.parent.appendLine;
    const playTone = window.parent.playTone;

    const KORN_CONFIG = { c1_traurig1: 100, c2_korn1: 2500, c3_traurig2: 4500, c4_brause_alert: 5500, c5_korn2: 7500, c6_traurig3: 8500, c7_schuetteln: 11000, c8_korn3: 12500, c9_undwenn: 13500, c11_vorn: 15000, c_drop: 16500, duration: 18000, fadeTime: 2500 };

    function resetKornAnimation(element, animationName) { element.style.animation = 'none'; element.offsetHeight; element.style.animation = animationName; }

    function spawnSadRain() {
      for (let i = 0; i < 15; i++) {
        const tear = document.createElement('div'); tear.className = 'korn-tear'; tear.textContent = '💧';
        tear.style.left = `${Math.random() * 100}vw`; tear.style.animationDuration = `${0.5 + Math.random()}s`; tear.style.animationDelay = `${Math.random() * 0.5}s`;
        document.body.appendChild(tear);
      }
    }

    function spawnFizz(amount, speedMultiplier = 1) {
      for (let i = 0; i < amount; i++) {
        const bubble = document.createElement('div'); bubble.className = 'brause-bubble';
        const size = 10 + Math.random() * 40; bubble.style.width = `${size}px`; bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 100}vw`; const dur = (0.5 + Math.random() * 0.8) * speedMultiplier; bubble.style.animationDuration = `${dur}s`;
        document.body.appendChild(bubble); setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, dur * 1000);
      }
    }

    function spawnSchuettelItems(emojis, count) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const item = document.createElement('div'); item.className = 'schuettel-item'; item.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          item.style.left = `${5 + Math.random() * 90}vw`; item.style.animationDuration = `${0.6 + Math.random() * 0.6}s`;
          document.body.appendChild(item); setTimeout(() => { if (item.parentNode) item.remove(); }, 1600);
        }, i * 50); 
      }
    }

    window.onload = () => {
      const audioElem = document.getElementById('audioKorn');
      if (audioElem) { audioElem.volume = 1; audioElem.play().catch(()=>{}); }

      appendLine(`<span class='text-blue-400 font-bold'>[THERAPIE] Melancholie erkannt. Verabreiche Gegenmittel...</span>`);
      root.classList.add('korn-sad-mode');
      const mainText = document.createElement('div'); mainText.className = 'korn-text'; document.body.appendChild(mainText);

      setTimeout(() => { mainText.innerHTML = "TRAURIG..."; resetKornAnimation(mainText, 'dropInSad 1s ease-out forwards'); spawnSadRain(); }, KORN_CONFIG.c1_traurig1);
      setTimeout(() => { root.classList.remove('korn-sad-mode'); mainText.className = 'korn-text text-korn'; mainText.innerHTML = "1. KORN!"; resetKornAnimation(mainText, 'smashKorn 0.3s ease-out forwards'); spawnSchuettelItems(['🥃', '🌾'], 8); if (navigator.vibrate) navigator.vibrate([150, 50, 150]); }, KORN_CONFIG.c2_korn1);
      setTimeout(() => { mainText.className = 'korn-text'; mainText.innerHTML = "NOCH<br>TRAURIG?!"; resetKornAnimation(mainText, 'dropInSad 0.5s ease-out forwards'); }, KORN_CONFIG.c3_traurig2);
      setTimeout(() => { mainText.className = 'korn-text text-brause'; mainText.innerHTML = "AHOI<br>BRAUSE!"; resetKornAnimation(mainText, 'smashKorn 0.2s forwards'); root.classList.add('brause-mode'); spawnSchuettelItems(['🍓', '🍋', '🍬', '💥'], 10); }, KORN_CONFIG.c4_brause_alert);
      setTimeout(() => { mainText.className = 'korn-text text-korn'; mainText.innerHTML = "2. KORN!"; resetKornAnimation(mainText, 'smashKorn 0.2s forwards'); setInterval(() => spawnFizz(15), 200); if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]); }, KORN_CONFIG.c5_korn2);
      setTimeout(() => { root.classList.remove('brause-mode'); root.classList.add('brause-mode-green'); mainText.className = 'korn-text fizz-shake'; mainText.style.color = "#ffffff"; mainText.innerHTML = "IMMER NOCH<br>TRAURIG?!"; }, KORN_CONFIG.c6_traurig3);
      setTimeout(() => { mainText.className = 'korn-text text-brause fizz-shake'; mainText.innerHTML = "SCHÜTTELN!"; mainText.style.transform = "translate3d(-50%, -50%, 0) scale(1.5)"; if (navigator.vibrate) navigator.vibrate([50, 50, 50, 50, 50, 50, 50, 50]); spawnFizz(50, 0.5); appendLine(`<span class='text-pink-500 font-extrabold'>[WARNUNG] DRUCK IM MUNDRAUM STEIGT KRITISCH!</span>`); }, KORN_CONFIG.c7_schuetteln);
      setTimeout(() => { mainText.className = 'korn-text text-korn fizz-shake'; mainText.innerHTML = "3. KORN!"; spawnSchuettelItems(['🥃', '💥', '💦'], 20); }, KORN_CONFIG.c8_korn3);
      setTimeout(() => { root.classList.remove('brause-mode-green'); mainText.className = 'korn-text'; mainText.innerHTML = "UND DANN..."; }, KORN_CONFIG.c9_undwenn);
      setTimeout(() => { mainText.innerHTML = "VON VORN!"; resetKornAnimation(mainText, 'spinVorn 0.5s ease-in forwards'); if (navigator.vibrate) navigator.vibrate([300, 100, 300]); }, KORN_CONFIG.c11_vorn);

      setTimeout(() => {
        mainText.style.display = 'none'; root.classList.add('fx-earthquake');
        const disco = document.getElementById('discoOverlay'); let tick = 0;
        setInterval(() => {
          const colors = ['bg-pink-500', 'bg-green-400', 'bg-yellow-400', 'bg-transparent'];
          disco.className = `fixed inset-0 pointer-events-none z-40 transition-opacity duration-75 opacity-70 ${colors[tick % colors.length]}`;
          if (tick % 2 === 0) spawnFizz(30, 0.4);
          if (tick % 5 === 0) spawnSchuettelItems(['🥃', '🍬', '💥', '💦', '😵‍💫'], 5);
          tick++;
        }, 80);

        if (navigator.vibrate) navigator.vibrate([600, 100, 600, 100, 600, 100, 1000]);
        appendLine(`<span class='text-yellow-400 font-extrabold text-sm animate-pulse'>🍬 [ZUCKERSCHOCK] SCHÜTTELKORN-OVERDRIVE ERREICHT!</span>`);

        setTimeout(() => {
          if (audioElem && !audioElem.paused) {
            const fadeInterval = setInterval(() => {
              if (audioElem.volume > 0.05) audioElem.volume -= 0.05; else { audioElem.pause(); clearInterval(fadeInterval); }
            }, KORN_CONFIG.fadeTime / 20);
          }
        }, (KORN_CONFIG.duration - KORN_CONFIG.c_drop) - KORN_CONFIG.fadeTime);

        setTimeout(() => { window.parent.postMessage("sudo_finished", "*"); }, KORN_CONFIG.duration - KORN_CONFIG.c_drop);
      }, KORN_CONFIG.c_drop);
    };
  </script>
</body>
</html>
