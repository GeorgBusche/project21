<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark"> <!-- WICHTIG GEGEN WEISSE BLITZER -->
  <style>
    /* 1. Echte Transparenz, damit das Terminal im Hintergrund sichtbar bleibt */
    body, html { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; 
      background-color: transparent !important; /* <--- HIER ÄNDERN */
      overflow: hidden; 
    }
    
    /* CRT Scanlines für den nahtlosen Übergang */
    body::before {
      content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.8;
    }
    
    /* ... restliches CSS ... */
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: transparent !important; overflow: hidden; }
    .tornado-storm-bg { position: fixed; inset: -50vw; z-index: 35; pointer-events: none; opacity: 0; background: repeating-linear-gradient(105deg, #0f172a, #0f172a 40px, #020617 40px, #020617 80px); transition: opacity 0.5s ease-in; animation: stormPan 0.3s linear infinite; }
    @keyframes stormPan { 0% { background-position: 0 0; } 100% { background-position: -80px 80px; } }
    .tornado-lightning { position: fixed; inset: 0; background: white; z-index: 99999; pointer-events: none; transform: translateZ(0); animation: lightningStrike 0.3s ease-out forwards; }
    @keyframes lightningStrike { 0% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } 100% { opacity: 0; } }
    .flash-yellow { animation: flashColYellow 0.2s forwards; transform: translateZ(0); } .flash-red { animation: flashColRed 0.2s forwards; transform: translateZ(0); }
    @keyframes flashColYellow { 0% { background: #facc15; opacity: 0.8; } 100% { background: transparent; opacity: 0; } }
    @keyframes flashColRed { 0% { background: #ef4444; opacity: 0.8; } 100% { background: transparent; opacity: 0; } }
    .tornado-text { position: fixed; top: 50%; left: 50%; transform: translate3d(-50%, -50%, 0); width: calc(100vw - 2rem); max-height: calc(100vh - 2rem); box-sizing: border-box; text-align: center; text-wrap: balance; overflow-wrap: anywhere; font-size: clamp(2rem, min(18vw, 16vh), 12rem); font-weight: 900; color: #ffffff; text-shadow: 5px 5px 0px #000, -2px -2px 0px #000, 0 0 20px #eab308; z-index: 9999; pointer-events: none; font-family: 'Impact', sans-serif; text-transform: uppercase; font-style: italic; line-height: 0.9; contain: layout paint style; will-change: transform, opacity, color; }
    .text-huge { font-size: clamp(2.5rem, min(22vw, 20vh), 14rem); text-shadow: 7px 7px 0 #000, 0 0 35px currentColor; }
    .text-sternburg-red { color: #dc2626; text-shadow: 5px 5px 0px #000, 0 0 25px #ef4444; } .text-glitch { animation: textGlitch 0.1s infinite; color: #06b6d4; }
    @keyframes textGlitch { 0% { transform: translate3d(-52%, -50%, 0) skewX(10deg); } 50% { transform: translate3d(-48%, -52%, 0) skewX(-15deg); } 100% { transform: translate3d(-50%, -48%, 0) skewX(5deg); } }
    @keyframes smashLeft { 0% { transform: translate3d(-100%, -50%, 0) skewX(30deg); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0) skewX(0); opacity: 1; } }
    @keyframes smashRight { 0% { transform: translate3d(100%, -50%, 0) skewX(-30deg); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0) skewX(0); opacity: 1; } }
    @keyframes stompCenter { 0% { transform: translate3d(-50%, -50%, 0) scale(4); opacity: 0; } 100% { transform: translate3d(-50%, -50%, 0) scale(1); opacity: 1; } }
    @keyframes stompFast { 0% { transform: translate3d(-50%, -50%, 0) scale(2); } 100% { transform: translate3d(-50%, -50%, 0) scale(1); } }
    @keyframes dropCrate { 0% { transform: translate3d(0, -120vh, 0) rotate(25deg) scale(1.8); } 100% { transform: translate3d(0, 120vh, 0) rotate(-25deg) scale(0.9); } }
    .tornado-crate { position: fixed; z-index: 9996; font-size: clamp(6rem, 15vw, 10rem); pointer-events: none; animation: dropCrate 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards; text-shadow: 0 10px 10px rgba(0,0,0,0.8); will-change: transform; }
    .sternburg-camo { position: fixed; inset: 0; z-index: 38; pointer-events: none; opacity: 0; background-image: linear-gradient(45deg, #dc2626 25%, transparent 25%, transparent 75%, #dc2626 75%, #dc2626), linear-gradient(45deg, #dc2626 25%, transparent 25%, transparent 75%, #dc2626 75%, #dc2626); background-size: 60px 60px; background-position: 0 0, 30px 30px; mix-blend-mode: overlay; animation: camoActivate 0.1s forwards, camoPulse 0.5s infinite alternate; transform: translateZ(0); }
    @keyframes camoActivate { to { opacity: 0.65; } } @keyframes camoPulse { 0% { filter: hue-rotate(0deg) contrast(1); } 100% { filter: hue-rotate(25deg) contrast(1.5); } }
    .tornado-alert-border { position: fixed; inset: 0; z-index: 9998; pointer-events: none; box-shadow: inset 0 0 80px #dc2626; border: 20px solid #dc2626; animation: alertFlash 0.2s infinite; opacity: 0; transform: translateZ(0); }
    @keyframes alertFlash { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    .wind-blast-item { position: fixed; z-index: 9996; pointer-events: none; font-size: clamp(3rem, 6vw, 5rem); left: 120vw; animation: windBlast linear forwards; will-change: transform; }
    @keyframes windBlast { 0% { transform: translate3d(0, 0, 0) rotate(-15deg); } 100% { transform: translate3d(-170vw, 100vh, 0) rotate(-45deg); } }
    .vortex-wrapper { position: fixed; bottom: -10vh; left: 50%; width: 0; height: 110vh; perspective: 1200px; z-index: 9995; pointer-events: none; opacity: 0; transition: opacity 0.3s, transform 0.5s ease-out; will-change: transform, opacity; }
    .vortex-spin { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-style: preserve-3d; animation: spinTornado 1.5s linear infinite; }
    .vortex-spin.hyper { animation: spinTornado 0.25s linear infinite; } 
    @keyframes spinTornado { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(-360deg); } }
    .vortex-item { position: absolute; left: -25px; width: 50px; text-align: center; font-size: clamp(2.5rem, 5vw, 4rem); text-shadow: 0 0 15px rgba(250, 204, 21, 0.8); will-change: transform; }
  </style>
</head>
<body>
  <div id="discoOverlay" class="fixed inset-0 pointer-events-none z-40 opacity-0 transition-opacity duration-75"></div>
  <audio id="audioTornado" preload="auto" src="../assets/audio/biertornado.mp3"></audio>
  <script src="cue-timings.js"></script>

  <script>
    const root = window.parent.document.getElementById('bodyRoot');
    const appendLine = window.parent.appendLine;
    const playTone = window.parent.playTone;

    const TORNADO_CONFIG = Object.assign(
      { c_drop: 12800, duration: 15000, fadeTime: 2500 },
      window.SUDO_CUE_TIMINGS?.biertornado || {}
    );

    function resetTornadoAnimation(element, animationName) { element.style.animation = 'none'; element.offsetHeight; element.style.animation = animationName; }
    function screenFlash(colorClass) { const flash = document.createElement('div'); flash.className = `fixed inset-0 z-50 pointer-events-none ${colorClass}`; document.body.appendChild(flash); setTimeout(() => flash.remove(), 250); }
    function triggerLightning() { const flash = document.createElement('div'); flash.className = 'tornado-lightning'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 400); }
    function playTornadoSynthFallback() {
      setTimeout(() => playTone(800, 'sawtooth', 0.5, 0.2), TORNADO_CONFIG.c1_sturm);
      setTimeout(() => playTone(600, 'sawtooth', 1.0, 0.3), TORNADO_CONFIG.c4_tornado);
      setTimeout(() => playTone(900, 'square', 0.5, 0.2), TORNADO_CONFIG.c12_sternburg);
    }

    function spawnChaoticWind() {
      const emojis = ['🍺', '🍻', '🌧️', '💨', '🌪️', '🧊', '⭐'];
      for (let i = 0; i < 30; i++) {
        const item = document.createElement('div'); item.className = 'wind-blast-item'; item.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        item.style.top = `${-40 + Math.random() * 100}vh`; const dur = 0.25 + Math.random() * 0.4; item.style.animationDuration = `${dur}s`; item.style.animationDelay = `${Math.random() * 0.8}s`;
        document.body.appendChild(item); setTimeout(() => { if (item.parentNode) item.remove(); }, (dur + 1) * 1000);
      }
    }

    function spawnCrateDrop() {
      const crates = ['📦', '🍺', '🍻'];
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const item = document.createElement('div'); item.className = 'tornado-crate'; item.textContent = crates[Math.floor(Math.random() * crates.length)];
          item.style.left = `${5 + Math.random() * 90}vw`; document.body.appendChild(item); setTimeout(() => { if (item.parentNode) item.remove(); }, 1200);
        }, i * 60); 
      }
    }

    function create3DTornado() {
      const wrapper = document.createElement('div'); wrapper.className = 'vortex-wrapper'; wrapper.id = 'activeTornado';
      const spin = document.createElement('div'); spin.className = 'vortex-spin'; spin.id = 'activeTornadoSpin'; wrapper.appendChild(spin);
      const items = ['🍺', '🍻', '⭐', '🔴', '🌪️', '📦']; 
      for(let i=0; i<150; i++) {
        const item = document.createElement('div'); item.className = 'vortex-item'; item.textContent = items[Math.floor(Math.random() * items.length)];
        const yPercent = Math.random() * 100; const radius = 25 + Math.pow((100 - yPercent) / 10, 2.5); const angle = Math.random() * 360;
        item.style.top = `${yPercent}%`; item.style.transform = `rotateY(${angle}deg) translateZ(${radius}px) rotateX(${Math.random()*45}deg)`; spin.appendChild(item);
      }
      document.body.appendChild(wrapper);
    }

    window.onload = () => {
      const audioElem = document.getElementById('audioTornado');
      const startTimeline = () => {

      const resetCam = () => { root.className = 'h-full flex flex-col justify-between select-none relative crt-overlay bg-neutral-950 pb-20'; };
      appendLine(`<span class='text-yellow-400 font-extrabold'>[WETTERDIENST] STURMTIEF RICARDO NÄHERT SICH!</span>`);

      const stormBg = document.createElement('div'); stormBg.className = 'tornado-storm-bg'; document.body.appendChild(stormBg);
      const mainText = document.createElement('div'); mainText.className = 'tornado-text'; document.body.appendChild(mainText);
      create3DTornado();

      setTimeout(() => { stormBg.style.opacity = "1"; mainText.innerHTML = "STURM-"; resetTornadoAnimation(mainText, 'smashRight 0.2s ease-out forwards'); }, TORNADO_CONFIG.c1_sturm);
      setTimeout(() => { mainText.style.color = "#facc15"; mainText.innerHTML = "-TIEF RICARDO"; resetTornadoAnimation(mainText, 'smashLeft 0.2s ease-out forwards'); screenFlash('flash-yellow'); }, TORNADO_CONFIG.c2_ricardo);
      setTimeout(() => { mainText.style.color = "#ffffff"; mainText.innerHTML = "BIER-"; resetTornadoAnimation(mainText, 'stompCenter 0.2s ease-out forwards'); }, TORNADO_CONFIG.c3_bier);
      setTimeout(() => {
        triggerLightning(); mainText.className = 'tornado-text text-sternburg-red text-huge'; mainText.innerHTML = "TORNADO!"; resetTornadoAnimation(mainText, 'stompCenter 0.2s ease-out forwards');
        const tornadoWrapper = document.getElementById('activeTornado'); if (tornadoWrapper) tornadoWrapper.style.opacity = "1";
        setInterval(spawnChaoticWind, 400); spawnChaoticWind(); if (navigator.vibrate) navigator.vibrate([400, 100, 400]);
      }, TORNADO_CONFIG.c4_tornado);

      setTimeout(() => { mainText.className = 'tornado-text'; mainText.innerHTML = "GIB"; root.classList.add('cam-zoom-in'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c5_gib1);
      setTimeout(() => { mainText.innerHTML = "MAL"; root.classList.remove('cam-zoom-in'); root.classList.add('cam-zoom-out'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c6_mal1);
      setTimeout(() => { mainText.innerHTML = "BIER!"; resetCam(); root.classList.add('cam-tilt-left'); screenFlash('flash-yellow'); resetTornadoAnimation(mainText, 'smashLeft 0.1s forwards'); }, TORNADO_CONFIG.c7_bier1);
      
      setTimeout(() => { resetCam(); mainText.innerHTML = "GIB"; root.classList.add('cam-zoom-in'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c8_gib2);
      setTimeout(() => { mainText.innerHTML = "MAL"; root.classList.remove('cam-zoom-in'); root.classList.add('cam-zoom-out'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c9_mal2);
      setTimeout(() => { mainText.innerHTML = "BIER!"; resetCam(); root.classList.add('cam-tilt-right'); screenFlash('flash-red'); resetTornadoAnimation(mainText, 'smashRight 0.1s forwards'); }, TORNADO_CONFIG.c10_bier2);

      setTimeout(() => { resetCam(); mainText.style.color = "#facc15"; mainText.innerHTML = "NÄCHSTE<br>LADUNG!"; resetTornadoAnimation(mainText, 'stompCenter 0.2s forwards'); spawnCrateDrop(); }, TORNADO_CONFIG.c11_ladung);

      setTimeout(() => { mainText.className = 'tornado-text text-sternburg-red'; mainText.innerHTML = "STERNBURG"; resetTornadoAnimation(mainText, 'smashLeft 0.1s forwards'); const camo = document.createElement('div'); camo.className = 'sternburg-camo'; camo.id = 'activeCamo'; document.body.appendChild(camo); }, TORNADO_CONFIG.c12_sternburg);
      setTimeout(() => { mainText.innerHTML = "-ANZUG!"; resetTornadoAnimation(mainText, 'smashRight 0.1s forwards'); }, TORNADO_CONFIG.c13_anzug);
      setTimeout(() => { mainText.className = 'tornado-text'; mainText.innerHTML = "MEINE"; const camo = document.getElementById('activeCamo'); if (camo) camo.style.filter = "invert(1)"; resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c14_meine);
      setTimeout(() => { mainText.className = 'tornado-text text-glitch text-huge'; mainText.innerHTML = "TARNUNG!"; const camo = document.getElementById('activeCamo'); if (camo) camo.style.filter = "none"; }, TORNADO_CONFIG.c15_tarnung);

      setTimeout(() => { mainText.className = 'tornado-text'; mainText.innerHTML = "GIB"; root.classList.add('cam-zoom-in'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c16_gib3);
      setTimeout(() => { mainText.innerHTML = "MAL"; root.classList.remove('cam-zoom-in'); root.classList.add('cam-zoom-out'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c17_mal3);
      setTimeout(() => { mainText.innerHTML = "BIER!"; resetCam(); root.classList.add('cam-tilt-left'); screenFlash('flash-yellow'); resetTornadoAnimation(mainText, 'smashLeft 0.1s forwards'); }, TORNADO_CONFIG.c18_bier3);
      
      setTimeout(() => { resetCam(); mainText.innerHTML = "GIB"; root.classList.add('cam-zoom-in'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c19_gib4);
      setTimeout(() => { mainText.innerHTML = "MAL"; root.classList.remove('cam-zoom-in'); root.classList.add('cam-zoom-out'); resetTornadoAnimation(mainText, 'stompFast 0.1s forwards'); }, TORNADO_CONFIG.c20_mal4);
      setTimeout(() => { mainText.innerHTML = "BIER!"; resetCam(); root.classList.add('cam-tilt-right'); screenFlash('flash-red'); resetTornadoAnimation(mainText, 'smashRight 0.1s forwards'); }, TORNADO_CONFIG.c21_bier4);

      setTimeout(() => { resetCam(); mainText.className = 'tornado-text text-huge'; mainText.style.color = "#ffffff"; mainText.innerHTML = "LETZTE<br>WARNUNG!"; resetTornadoAnimation(mainText, 'stompCenter 0.2s forwards'); const alertBorder = document.createElement('div'); alertBorder.className = 'tornado-alert-border'; document.body.appendChild(alertBorder); if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200, 100]); }, TORNADO_CONFIG.c22_warnung);

      setTimeout(() => {
        mainText.style.display = 'none'; triggerLightning();
        const spin = document.getElementById('activeTornadoSpin'); if (spin) spin.classList.add('hyper');
        const disco = document.getElementById('discoOverlay'); let tick = 0;
        setInterval(() => {
          const colors = ['bg-white', 'bg-red-600', 'bg-transparent', 'bg-yellow-400'];
          disco.className = `fixed inset-0 pointer-events-none z-40 transition-opacity duration-75 opacity-80 ${colors[tick % colors.length]}`;
          if (tick % 2 === 0) root.style.transform = `translate(${(Math.random()-0.5)*30}px, ${(Math.random()-0.5)*30}px) scale(1.05)`;
          tick++;
        }, 80);

        if (navigator.vibrate) navigator.vibrate([600, 100, 600, 100, 600, 100, 1000]);
        appendLine(`<span class='text-yellow-400 font-extrabold text-sm animate-pulse'>🌪️ [ESKALATION] TORNADO KATEGORIE 5. RETTE SICH WER KANN!</span>`);

        setTimeout(() => {
          if (audioElem && !audioElem.paused) {
            const fadeInterval = setInterval(() => {
              if (audioElem.volume > 0.05) audioElem.volume -= 0.05; else { audioElem.pause(); clearInterval(fadeInterval); }
            }, TORNADO_CONFIG.fadeTime / 20);
          }
        }, (TORNADO_CONFIG.duration - TORNADO_CONFIG.c_drop) - TORNADO_CONFIG.fadeTime);

        setTimeout(() => { window.parent.postMessage("sudo_finished", "*"); }, TORNADO_CONFIG.duration - TORNADO_CONFIG.c_drop);
      }, TORNADO_CONFIG.c_drop);
      };

      window.startSudoTimeline(audioElem, startTimeline, 'Biertornado', playTornadoSynthFallback);
    };
  </script>
</body>
</html>
