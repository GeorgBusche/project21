<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style>
    /* 1. Echte Transparenz, damit das Terminal im Hintergrund sichtbar bleibt */
    body, html { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; 
      background-color: transparent !important; /* <--- HIER ÄNDERN */
      overflow: hidden; 
    }
    body::before {
      content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.8;
    }
    
    /* Kinetischer Text - Bleibt jetzt lange stehen! */
    .bella-text {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Arial Black', Impact, sans-serif; font-size: clamp(5rem, 25vw, 15rem); font-weight: 900;
      text-transform: uppercase; white-space: nowrap; z-index: 9999;
      opacity: 0; pointer-events: none;
    }
    .text-green { color: #009246; text-shadow: 0 0 50px #009246, 0 0 20px #ffffff; }
    .text-white-italy { color: #ffffff; text-shadow: 0 0 50px #ffffff, 0 0 30px #009246; }
    .text-red { color: #CE2B37; text-shadow: 0 0 80px #CE2B37, 0 0 30px #ffffff; }

    /* Brachialer Einschlag mit langer Standzeit */
    .bella-smash { animation: smashHit 1.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
    @keyframes smashHit {
      0% { transform: translate(-50%, -50%) scale(4) rotate(-20deg); opacity: 0; filter: blur(20px); }
      10% { transform: translate(-50%, -50%) scale(0.9) rotate(5deg); opacity: 1; filter: blur(0); }
      15% { transform: translate(-50%, -50%) scale(1.1) rotate(-2deg); }
      20% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
      85% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; filter: blur(0); } /* Steht extrem lange! */
      100% { transform: translate(-50%, -50%) scale(2) rotate(10deg); opacity: 0; filter: blur(15px); }
    }

    /* Italien-Stroboskop (Massiver Rave Overlay) */
    .bella-strobe {
      position: fixed; inset: 0; z-index: 50; pointer-events: none; 
      mix-blend-mode: overlay; opacity: 0;
    }

    /* Explosions-Partikel (Emojis, die ins Gesicht fliegen) */
    .bella-particle {
      position: fixed; top: 50%; left: 50%; z-index: 100;
      font-size: clamp(4rem, 12vw, 8rem); pointer-events: none;
      animation: explodeOut 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes explodeOut {
      0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
      20% { transform: translate(calc(-50% + var(--tx)*0.4), calc(-50% + var(--ty)*0.4)) scale(2.5) rotate(var(--rot)); }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.8) rotate(calc(var(--rot) * 2)); opacity: 0; }
    }
    
    /* Druckwellen-Ring */
    .bella-ring {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 0; height: 0; border: 30px solid; border-radius: 50%;
      pointer-events: none; z-index: 9998;
      animation: shockwave 0.7s ease-out forwards;
    }
    @keyframes shockwave {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 130vw; height: 130vw; opacity: 0; border-width: 1px; }
    }
  </style>
</head>
<body>
  
  <audio id="audioBellaNapoli" preload="auto" src="../assets/audio/bella_napoli.mp3"></audio>

  <script>
    const root = window.parent.document.getElementById('bodyRoot');
    const appendLine = window.parent.appendLine;
    const BELLA_CONFIG = { hit1: 50, hit2: 1650, drop: 3050, duration: 7000, fadeTime: 1500 };

    function flashText(text, colorClass) {
      const el = document.createElement('div');
      el.className = `bella-text ${colorClass} bella-smash`;
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1600); 
    }

    function createShockwave(colorHex) {
      const ring = document.createElement('div');
      ring.className = 'bella-ring';
      ring.style.borderColor = colorHex;
      ring.style.boxShadow = `0 0 60px ${colorHex}, inset 0 0 60px ${colorHex}`;
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 700);
    }

    function explodeEmojis(count) {
      const emojis = ['🍕', '🚜', '🍺', '🤌', '🔥', '🎉', '🍝', '🍷', '💥', '🇮🇹'];
      const frag = document.createDocumentFragment();
      for(let i=0; i<count; i++) {
        const p = document.createElement('div');
        p.className = 'bella-particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 50 + Math.random() * 80; 
        const tx = Math.cos(angle) * distance + 'vw';
        const ty = Math.sin(angle) * distance + 'vh';
        const rot = (Math.random() - 0.5) * 1440 + 'deg'; // Rotiert wie verrückt
        
        p.style.setProperty('--tx', tx);
        p.style.setProperty('--ty', ty);
        p.style.setProperty('--rot', rot);
        
        frag.appendChild(p);
        setTimeout(() => p.remove(), 1300);
      }
      document.body.appendChild(frag);
    }

    window.onload = () => {
      const audioElem = document.getElementById('audioBellaNapoli');
      if (audioElem) { audioElem.volume = 1; audioElem.play().catch(()=>{}); }

      appendLine("<span class='text-amber-300 font-bold'>[SUDO] Zünde Dorf-Abriss (Bella Napoli)...</span>");

      // 1. HIT: BELLA! (Grün)
      setTimeout(() => {
        flashText("BELLA!", "text-green");
        createShockwave("#009246");
        explodeEmojis(25);
        if (navigator.vibrate) navigator.vibrate(200);
      }, BELLA_CONFIG.hit1);

      // 2. HIT: BELLA! (Weiß)
      setTimeout(() => {
        flashText("BELLA!", "text-white-italy");
        createShockwave("#ffffff");
        explodeEmojis(35);
        if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
      }, BELLA_CONFIG.hit2);

      // 3. DROP: NAPOLI! (Rot + Eskalation)
      setTimeout(() => {
        flashText("NAPOLI!", "text-red");
        createShockwave("#CE2B37");
        explodeEmojis(120); // Massive Explosion
        
        if(root) root.classList.add('cam-speed-shake');

        const strobe = document.createElement('div');
        strobe.className = 'bella-strobe';
        document.body.appendChild(strobe);
        
        let tick = 0;
        const partyTimer = setInterval(() => {
          const colors = ['#009246', '#ffffff', '#CE2B37', 'transparent']; 
          strobe.style.backgroundColor = colors[tick % colors.length];
          strobe.style.opacity = tick % 4 === 3 ? "0" : "0.9"; // Harte Stroboskop-Blitze
          
          if(tick % 3 === 0) explodeEmojis(15);
          tick++;
        }, 90);

        if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500, 100, 800]);
        appendLine("<span class='text-rose-400 font-extrabold text-sm animate-pulse'>🎺 [DROP] NAPOLI! PARTYRAUM ERREICHT MAXIMALEN DURCHSATZ!</span>");

        setTimeout(() => {
          if (audioElem && !audioElem.paused) {
            const fadeInterval = setInterval(() => {
              if (audioElem.volume > 0.05) audioElem.volume -= 0.05; else { audioElem.pause(); clearInterval(fadeInterval); }
            }, BELLA_CONFIG.fadeTime / 20);
          }
        }, (BELLA_CONFIG.duration - BELLA_CONFIG.drop) - BELLA_CONFIG.fadeTime);

        setTimeout(() => {
          if(root) root.classList.remove('cam-speed-shake'); 
          clearInterval(partyTimer);
          window.parent.postMessage("sudo_finished", "*");
        }, BELLA_CONFIG.duration - BELLA_CONFIG.drop);

      }, BELLA_CONFIG.drop);
    };
  </script>
</body>
</html>
